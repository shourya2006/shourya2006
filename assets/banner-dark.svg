<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Shourya Bafna</title>
  <desc id="desc">Full-stack and AI engineer. Next.js, Node.js, TypeScript, RAG and LLM apps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#0A1F23"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .caret{animation:blink 1.1s steps(1) infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes blink{50%{opacity:0}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.caret,.pulse{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <text x="64" y="92" class="mono" font-size="20" fill="#2DD4BF">~/shourya-bafna</text>
  <text x="64" y="172" class="sans" font-size="68" font-weight="700" fill="#E6EDF3" letter-spacing="-1.5">Shourya Bafna</text>
  <text x="64" y="222" class="sans" font-size="30" fill="#8B949E">Full-stack &amp; AI Engineer<tspan class="caret" fill="#2DD4BF"> ▍</tspan></text>
  <text x="64" y="272" class="mono" font-size="18" fill="#8B949E">Next.js · Node.js · TypeScript · RAG · LLM apps</text>

  <!-- A small workflow graph: a nod to NextFlow -->
  <g fill="none" stroke="#2DD4BF" stroke-width="2" stroke-opacity="0.55">
    <path d="M820 110 C 880 110, 880 160, 940 160"/>
    <path d="M820 210 C 880 210, 880 160, 940 160"/>
    <path d="M1000 160 C 1040 160, 1040 110, 1080 110"/>
    <path d="M1000 160 C 1040 160, 1040 210, 1080 210"/>
  </g>
  <g stroke="#2DD4BF" stroke-width="2" fill="#0D1117">
    <rect x="760" y="92" width="60" height="36" rx="8"/>
    <rect x="760" y="192" width="60" height="36" rx="8"/>
    <rect x="940" y="140" width="60" height="40" rx="10"/>
    <rect x="1080" y="92" width="60" height="36" rx="8"/>
    <rect x="1080" y="192" width="60" height="36" rx="8"/>
  </g>
  <g class="mono" font-size="13" fill="#8B949E" text-anchor="middle">
    <text x="790" y="115">text</text><text x="790" y="215">image</text>
    <text x="970" y="165" fill="#2DD4BF">LLM</text>
    <text x="1110" y="115">video</text><text x="1110" y="215">output</text>
  </g>
  <circle cx="970" cy="160" r="34" fill="none" stroke="#2DD4BF" stroke-width="1.5" class="pulse"/>
</svg>
